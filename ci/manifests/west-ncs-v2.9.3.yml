#
# The nRF Connect SDK v2.9, the last 2.x series, on Zephyr v3.7: many products in production shipped and were certified on it,
# and Nordic still patches it. Checked by the maintainers' full local checks, not in CI. Only what Tracegale builds against: Nordic's
# Zephyr, its MCUboot and crypto, and the Nordic HAL and libraries; docs/firmware/README.md, "The nRF Connect SDK". Nothing
# from the SDK is copied into Tracegale; it's only built against. Memfault's SDK, which the SDK also lists, is left out.

manifest:
  remotes:
    - name: ncs
      url-base: https://github.com/nrfconnect
  projects:
    - name: nrf
      remote: ncs
      repo-path: sdk-nrf
      revision: v2.9.3
      import:
        name-allowlist:
          - nrf
          - zephyr
          - cmsis
          - cmsis_6
          - hal_nordic
          - mbedtls
          - mcuboot
          - nrfxlib
          - oberon-psa-crypto
          - segger
          - tinycrypt
          - tf-psa-crypto
          - trusted-firmware-m
          - zcbor
  self:
    path: tracegale
