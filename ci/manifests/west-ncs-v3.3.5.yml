#
# The nRF Connect SDK v3.3, the release before the latest, which Nordic still patches. Checked by the maintainers' full local checks only,
# not in CI. Only what Tracegale builds against: Nordic's Zephyr, its MCUboot and crypto, and the Nordic HAL and libraries;
# docs/firmware/README.md, "The nRF Connect SDK". Nothing from the SDK is copied into Tracegale; it's only built against.
# Memfault's SDK, which the SDK also lists, is left out.

manifest:
  remotes:
    - name: ncs
      url-base: https://github.com/nrfconnect
  projects:
    - name: nrf
      remote: ncs
      repo-path: sdk-nrf
      revision: v3.3.5
      import:
        name-allowlist:
          - nrf
          - zephyr
          - cmsis
          - cmsis_6
          - hal_nordic
          - libmodem
          - mbedtls
          - mcuboot
          - nrfxlib
          - oberon-psa-crypto
          - segger
          - tf-psa-crypto
          - trusted-firmware-m
          - zcbor
  self:
    path: tracegale
