CONFIG_ZTEST=y
CONFIG_TRACEGALE=y
CONFIG_TRACEGALE_TRANSPORT_CUSTOM=y
CONFIG_TRACEGALE_AUTOSTART=n
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_GENERATOR=y
# What an application with MCUboot and settings storage has. With these, the one line turns updates on.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
# Writing flash that wasn't erased is an error here, as it is on real NOR flash.
CONFIG_FLASH_SIMULATOR_DOUBLE_WRITES=n
# Small, so that an image of a few pages takes many messages.
CONFIG_TRACEGALE_MAX_MESSAGE=256
# A whole check-in runs on the test's own stack, as it would on Tracegale's thread.
CONFIG_ZTEST_STACK_SIZE=4096
# Each suite tests one feature. Reports of metrics have their own, in tests/metrics.
CONFIG_TRACEGALE_METRICS=n
# Logs have their own suite, in tests/logs.
CONFIG_TRACEGALE_LOGS=n
