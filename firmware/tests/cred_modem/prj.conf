CONFIG_ZTEST=y
CONFIG_TRACEGALE=y
CONFIG_TRACEGALE_TRANSPORT_CUSTOM=y
CONFIG_TRACEGALE_AUTOSTART=n
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_GENERATOR=y
# sha256.c is built by the test, so nothing else may build it.
CONFIG_TRACEGALE_CRASH=n
CONFIG_TRACEGALE_METRICS=n
CONFIG_TRACEGALE_LOGS=n
CONFIG_BASE64=y
# Where the backend remembers what the modem holds.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_ZTEST_STACK_SIZE=4096
