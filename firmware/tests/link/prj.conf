CONFIG_ZTEST=y
CONFIG_TRACEGALE=y
CONFIG_TRACEGALE_TRANSPORT_CUSTOM=y
CONFIG_TRACEGALE_AUTOSTART=y
# A link the application powers only now and then, such as a modem.
CONFIG_TRACEGALE_LINK_UP_AT_BOOT=n
# Short, so a check-in comes due while the link is down.
CONFIG_TRACEGALE_CHECKIN_INTERVAL_S=10
CONFIG_TRACEGALE_BACKOFF_MIN_S=600
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TRACEGALE_METRICS=n
CONFIG_TRACEGALE_LOGS=n
