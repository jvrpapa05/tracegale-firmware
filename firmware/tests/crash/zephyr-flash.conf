# Zephyr's flash partition backend instead of Tracegale's store, on a simulated flash. Choosing it turns
# CONFIG_TRACEGALE_CRASH_RAM off. The test is src/zephyr_backend.c.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_DEBUG_COREDUMP_BACKEND_FLASH_PARTITION=y
