CONFIG_ZTEST=y
CONFIG_TRACEGALE=y
CONFIG_TRACEGALE_TRANSPORT_CUSTOM=y
CONFIG_TRACEGALE_AUTOSTART=n
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_GENERATOR=y
# Small, so tests can fill it. The tests call the store directly, and don't crash.
CONFIG_TRACEGALE_CRASH_RAM_SIZE=512
CONFIG_TRACEGALE_CRASH_REBOOT=n
CONFIG_TRACEGALE_MAX_MESSAGE=256
# Upload hashes and builds messages on the test's own stack, as it would on Tracegale's thread.
CONFIG_ZTEST_STACK_SIZE=2048
# Each suite tests one feature. Reports of metrics have their own, in tests/metrics.
CONFIG_TRACEGALE_METRICS=n
# Logs have their own suite, in tests/logs.
CONFIG_TRACEGALE_LOGS=n
