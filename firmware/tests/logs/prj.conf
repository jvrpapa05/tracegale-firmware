CONFIG_ZTEST=y
CONFIG_TRACEGALE=y
CONFIG_TRACEGALE_TRANSPORT_CUSTOM=y
CONFIG_TRACEGALE_AUTOSTART=n
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_GENERATOR=y
# So the buffer for messages is its smallest, 256 bytes, which tests splitting.
CONFIG_TRACEGALE_CRASH=n
CONFIG_ZTEST_STACK_SIZE=2048
# Each suite tests one feature.
CONFIG_TRACEGALE_METRICS=n
CONFIG_LOG=y
# Records reach the backend at once, so tests needn't wait for the log thread. deferred.conf tests the other mode.
CONFIG_LOG_MODE_IMMEDIATE=y
