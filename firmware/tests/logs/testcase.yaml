tests:
  tracegale.logs:
    platform_allow:
      - native_sim
      - qemu_cortex_m3
      - qemu_riscv32
    integration_platforms:
      - native_sim
  tracegale.logs.deferred:
    extra_args:
      - EXTRA_CONF_FILE=deferred.conf
    platform_allow:
      - native_sim
      - qemu_cortex_m3
    integration_platforms:
      - native_sim
  tracegale.logs.small:
    extra_args:
      - EXTRA_CONF_FILE=small.conf
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
  tracegale.logs.off:
    extra_args:
      - EXTRA_CONF_FILE=off.conf
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
