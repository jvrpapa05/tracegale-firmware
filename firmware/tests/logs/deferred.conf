# Zephyr's default mode: a thread of its own hands records to the backends.
CONFIG_LOG_MODE_DEFERRED=y
# The test hands records to the backends itself, so it knows when they have arrived. Zephyr's log thread does that
# in a product, which samples/connect and the end-to-end test run.
CONFIG_LOG_PROCESS_THREAD=n
