#
# A cellular link through Nordic's modem library, in the nRF Connect SDK, for any board with an nRF91 series chip. The modem has
# its own TCP/IP and TLS, so the application needs neither Zephyr's network stack nor a TLS library, and Tracegale adds neither.
# This is what such an application has anyway; Tracegale adds nothing here.
CONFIG_NET_NATIVE=n
CONFIG_NET_TCP=n
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NRF_MODEM_LIB_NET_IF=y
CONFIG_NRF_MODEM_LIB_NET_IF_AUTO_START=y
CONFIG_NRF_MODEM_LIB_NET_IF_AUTO_CONNECT=y
# The modem takes new credentials only while its link is off. With the AT shell, "at AT+CFUN=4" turns it off before provisioning,
# and "at AT+CFUN=1" turns it on again after "tracegale commit".
CONFIG_AT_SHELL=y
