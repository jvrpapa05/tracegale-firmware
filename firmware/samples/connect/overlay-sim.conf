# native_sim on Zephyr v4: reaches servers on this machine through its sockets, with the shell on stdin and stdout. Not secure.
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y
CONFIG_SHELL_VT100_COMMANDS=n
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=1024
