# qemu_cortex_m3, with Zephyr's own network stack, QEMU's user-mode network and 64 KB of RAM. Not secure.
CONFIG_NET_QEMU_ETHERNET=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_STELLARIS=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.0.2.15"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.0.2.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_MAX_SERVERS=1
CONFIG_DNS_NUM_CONCUR_QUERIES=1
CONFIG_TEST_RANDOM_GENERATOR=y
# No flash partition on this target, so provisioning lasts until reset.
CONFIG_SETTINGS=n
CONFIG_SETTINGS_NVS=n
CONFIG_NVS=n
CONFIG_FLASH_MAP=n
CONFIG_FLASH=n
# Trimmed to fit, and to find out what is really used.
CONFIG_MBEDTLS_HEAP_SIZE=12000
CONFIG_TRACEGALE_STACK_SIZE=4096
# Certificates from the Tracegale server are about 406 bytes.
CONFIG_TRACEGALE_CRED_MAX_SIZE=448
# Crash reports, with a smaller store than the default 2 KB, and the commands that crash on purpose for the tests.
CONFIG_TRACEGALE_CRASH_RAM_SIZE=1536
CONFIG_TRACEGALE_SHELL_TEST=y
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_LOG=n
CONFIG_SHELL_VT100_COMMANDS=n
CONFIG_SHELL_HISTORY=n
CONFIG_SHELL_TAB=n
CONFIG_SHELL_WILDCARD=n
CONFIG_NET_BUF_RX_COUNT=12
CONFIG_NET_BUF_TX_COUNT=12
CONFIG_NET_PKT_RX_COUNT=7
CONFIG_NET_PKT_TX_COUNT=7
CONFIG_NET_MAX_CONTEXTS=3
CONFIG_NET_MAX_CONN=3
CONFIG_ZVFS_OPEN_MAX=5
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=3
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_MAIN_STACK_SIZE=1536
CONFIG_ISR_STACK_SIZE=1536
