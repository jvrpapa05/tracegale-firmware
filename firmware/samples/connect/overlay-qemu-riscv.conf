# qemu_riscv32, with Zephyr's own network stack and QEMU's user-mode network through a virtio network device. Not secure.
# Unlike overlay-qemu.conf, nothing is trimmed: Tracegale's thread has its default stack, so the run measures what a TLS
# handshake really uses on RISC-V.
CONFIG_NET_QEMU_ETHERNET=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.0.2.15"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.0.2.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_DNS_RESOLVER=y
# QEMU keeps locked memory-protection entries through a reset, which real chips clear. The restarted image then can't run, so
# the crash would never be sent. On this emulator only, memory protection is off.
CONFIG_RISCV_PMP=n
# No flash on this target, so provisioning lasts until reset.
CONFIG_SETTINGS=n
CONFIG_SETTINGS_NVS=n
CONFIG_NVS=n
CONFIG_FLASH_MAP=n
CONFIG_FLASH=n
# The commands that crash on purpose, for the tests.
CONFIG_TRACEGALE_SHELL_TEST=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_LOG=n
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
