# The only line Tracegale needs.
CONFIG_TRACEGALE=y

# The rest is what the application would have anyway: its connection, and somewhere to keep settings.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_SHELL=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_ZVFS_OPEN_MAX=8
CONFIG_LOG=y
