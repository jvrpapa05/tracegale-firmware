#
# A cellular link through Zephyr's own generic modem driver, which brings up PPP over the modem that the board's devicetree
# describes. This names no board or modem: it's what any application with a cellular link would have, and Tracegale adds
# nothing to it. Set the access point name for your SIM with CONFIG_MODEM_CELLULAR_APN.
CONFIG_NET_L2_PPP=y
CONFIG_NET_L2_PPP_OPTION_DNS_USE=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_MODEM=y
CONFIG_MODEM_CELLULAR=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
