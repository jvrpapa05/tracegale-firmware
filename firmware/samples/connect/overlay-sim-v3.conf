# The same as overlay-sim.conf, for Zephyr v3.7's option names. Not secure.
CONFIG_ETH_NATIVE_POSIX=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_NATIVE_UART_0_ON_STDINOUT=y
CONFIG_SHELL_VT100_COMMANDS=n
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=1024

# A simulator or emulator, whose random numbers needn't be secure. Never in a product.
CONFIG_TRACEGALE_INSECURE_RANDOM_FOR_TESTS=y
