sample:
  name: Tracegale hello
  description: Prints the version of the Tracegale firmware stack.
tests:
  sample.tracegale.hello:
    platform_allow:
      - native_sim
      - qemu_cortex_m3
      - qemu_riscv32
    integration_platforms:
      - native_sim
    harness: console
    harness_config:
      type: one_line
      regex:
        - "Tracegale version: [0-9]+\\.[0-9]+\\.[0-9]+"
