CONFIG_TRACEGALE=y
# The application carries Tracegale's messages over its own link, such as a modem's MQTT and TLS on AT commands.
CONFIG_TRACEGALE_TRANSPORT_CUSTOM=y
# The link speaks Tracegale's MQTT binding, so the device takes the server's MQTT port.
CONFIG_TRACEGALE_BINDING_MQTT=y
# The link is up only when the application says so: no attempt fails while the modem is off.
CONFIG_TRACEGALE_LINK_UP_AT_BOOT=n
CONFIG_ENTROPY_GENERATOR=y
CONFIG_SHELL=y
# Settings storage keeps the device's credentials.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_LOG=y
